name: Validate
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validation:
    name: Repository validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
    - name: Evaluate locked NixOS configuration
      run: nix eval --no-write-lock-file --raw .#nixosConfigurations.media.config.system.build.toplevel.drvPath
    - name: Validate all Kubernetes targets
      run: |
        nix develop --no-write-lock-file .#ci --command bash -euo pipefail -c '
          while IFS= read -r -d "" file; do
            echo "Validating ${file%/*}"
            kustomize build "${file%/*}" |
              yq eval "del(.sops)" - |
              kubeconform -strict -summary -ignore-missing-schemas -kubernetes-version 1.34.0
          done < <(find cluster -name kustomization.yaml -print0)
        '
    - name: Reject obsolete HelmRelease APIs
      run: |
        if grep -R -n "apiVersion: helm.toolkit.fluxcd.io/v2beta" cluster; then
          echo "Use HelmRelease v2, which is served by the bundled Flux CRD."
          exit 1
        fi
    - name: Ensure validation did not modify tracked files
      run: git diff --exit-code
