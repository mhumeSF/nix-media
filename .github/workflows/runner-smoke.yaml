name: Runner smoke test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: GitHub-hosted runner smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Report runner environment
      run: |
        echo "Hello from the GitHub-hosted Ubuntu runner"
        uname -a
        nproc
        df -h "$GITHUB_WORKSPACE"
