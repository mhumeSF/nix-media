---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://prometheus-community.github.io/helm-charts
      chart: kube-prometheus-stack
      version: 91.9.0
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
      interval: 5m
  timeout: 20m
  maxHistory: 3
  valuesFrom:
  - kind: ConfigMap
    name: flux-kube-state-metrics-config
    valuesKey: values.yaml
  values:
    alertmanager:
      enabled: true
      ingress:
        enabled: false

    grafana:
      enabled: false

    prometheus:
      ingress:
        enabled: false
      prometheusSpec:
        retention: 30d
        retentionSize: 25GB
        storageSpec:
          volumeClaimTemplate:
            spec:
              storageClassName: local-path
              accessModes:
              - ReadWriteOnce
              resources:
                requests:
                  storage: 30Gi
        ruleSelector: {}
        ruleNamespaceSelector: {}
        ruleSelectorNilUsesHelmValues: false
        serviceMonitorSelector: {}
        serviceMonitorNamespaceSelector: {}
        serviceMonitorSelectorNilUsesHelmValues: false
        podMonitorSelector: {}
        podMonitorNamespaceSelector: {}
        podMonitorSelectorNilUsesHelmValues: false
        additionalScrapeConfigs:
        # etcd is a NixOS service on the control-plane VM, not an etcd pod.
        - job_name: kube-etcd
          scrape_interval: 30s
          kubernetes_sd_configs:
          - role: node
          relabel_configs:
          - source_labels: [__meta_kubernetes_node_label_node_role_kubernetes_io_control_plane]
            regex: "true"
            action: keep
          - source_labels: [__meta_kubernetes_node_address_InternalIP]
            target_label: __address__
            replacement: "$1:2381"
          - target_label: job
            replacement: kube-etcd
          - target_label: namespace
            replacement: kube-system
          - target_label: service
            replacement: kube-prometheus-stack-kube-etcd

    kubeApiServer:
      enabled: true

    kubeEtcd:
      enabled: true
      service:
        enabled: false
      serviceMonitor:
        enabled: false

    kubelet:
      enabled: true

    kubeControllerManager:
      enabled: true

    nodeExporter:
      serviceMonitor:
        relabelings:
        - action: replace
          regex: (.*)
          replacement: $1
          sourceLabels:
          - __meta_kubernetes_pod_node_name
          targetLabel: kubernetes_node

    kubeScheduler:
      enabled: true

    kubeProxy:
      enabled: false  # Disabled - using Cilium kube-proxy replacement
