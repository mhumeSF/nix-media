---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: grafana
  namespace: monitoring
spec:
  interval: 15m
  chart:
    spec:
      # renovate: registryUrl=https://grafana.github.io/helm-charts
      chart: grafana
      version: 10.5.15
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  maxHistory: 3
  values:
    deploymentStrategy:
      type: Recreate
    grafana.ini:
      server:
        root_url: "https://grafana.${CLUSTER_DOMAIN}"
      paths:
        data: /var/lib/grafana/data
        logs: /var/log/grafana
        plugins: /var/lib/grafana/plugins
        provisioning: /etc/grafana/provisioning
      analytics:
        check_for_updates: false
      log:
        mode: console
      grafana_net:
        url: https://grafana.net
      auth.anonymous:
        enabled: true
      auth.basic:
        disable_login_form: true
    initChownData:
      securityContext:
        capabilities:
          add:
          - CHOWN
          - DAC_OVERRIDE
          drop:
          - ALL
    persistence:
      enabled: true
      storageClassName: local-path
      accessModes:
      - ReadWriteOnce
      size: 5Gi
    ingress:
      enabled: false
    sidecar:
      dashboards:
        enabled: true
        label: grafana_dashboard
      datasources:
        enabled: true
        label: grafana_datasource
        org_name: Main Org.
        org_role: Editor
      auth.basic:
        enabled: false
      auth:
        disable_login_form: true
        disable_signout_menu: true
    datasources:
      datasources.yaml:
        apiVersion: 1
        deleteDatasources:
        - name: Loki
          orgId: 1
        datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://kube-prometheus-stack-prometheus:9090
          isDefault: false
    dashboardProviders:
      dashboardproviders.yaml:
        apiVersion: 1
        providers:
        - name: 'default'
          orgId: 1
          folder: ''
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
        - name: "flux"
          orgId: 1
          folder: "flux"
          type: file
          updateIntervalSeconds: 10
          disableDeletion: false
          allowUiUpdates: true
          options:
            path: /var/lib/grafana/dashboards/flux
        - name: "networking"
          orgId: 1
          folder: "networking"
          type: file
          updateIntervalSeconds: 10
          disableDeletion: false
          allowUiUpdates: true
          options:
            path: /var/lib/grafana/dashboards/networking
        - name: "argo"
          orgId: 1
          folder: "argo"
          type: file
          updateIntervalSeconds: 10
          disableDeletion: false
          allowUiUpdates: true
          options:
            path: /var/lib/grafana/dashboards/argo
        - name: 'grafana-dashboards-kubernetes'
          orgId: 1
          folder: 'Kubernetes'
          type: file
          disableDeletion: true
          editable: true
          options:
            path: /var/lib/grafana/dashboards/grafana-dashboards-kubernetes
    dashboards:
      grafana-dashboards-kubernetes:
        k8s-system-api-server:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
          token: ''
        k8s-system-coredns:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
          token: ''
        k8s-views-global:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
          token: ''
        k8s-views-namespaces:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
          token: ''
        k8s-views-nodes:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
          token: ''
        k8s-views-pods:
          url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
          token: ''
        etcd:
          gnetId: 3070
          datasource: Prometheus

      default:
        node-exporter-full:
          datasource: Prometheus
          url: https://grafana.com/api/dashboards/1860/revisions/22/download

      flux:
        cluster:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/cluster.json
          datasource: Prometheus
        control-plane:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/control-plane.json
          datasource: Prometheus
        logs:
          url: https://raw.githubusercontent.com/fluxcd/flux2-monitoring-example/main/monitoring/configs/dashboards/logs.json
          datasource: Loki

      argo:
        cluster:
          url: https://raw.githubusercontent.com/argoproj/argo-cd/v2.5.5/examples/dashboard.json
          datasource: Prometheus

      networking:
        blocky:
          url: https://raw.githubusercontent.com/0xERR0R/blocky/main/docs/blocky-grafana.json
          datasource: Prometheus
        cilium:
          url: https://raw.githubusercontent.com/cilium/cilium/v1.19/examples/kubernetes/addons/prometheus/files/grafana-dashboards/cilium-dashboard.json
          datasource: Prometheus
        cilium-operator:
          url: https://raw.githubusercontent.com/cilium/cilium/v1.19/examples/kubernetes/addons/prometheus/files/grafana-dashboards/cilium-operator-dashboard.json
          datasource: Prometheus
        hubble:
          url: https://raw.githubusercontent.com/cilium/cilium/v1.19/examples/kubernetes/addons/prometheus/files/grafana-dashboards/hubble-dashboard.json
          datasource: Prometheus
        envoy-proxy-global:
          url: https://raw.githubusercontent.com/envoyproxy/gateway/main/charts/gateway-addons-helm/dashboards/envoy-proxy-global.json
          datasource: Prometheus
        envoy-clusters:
          url: https://raw.githubusercontent.com/envoyproxy/gateway/main/charts/gateway-addons-helm/dashboards/envoy-clusters.json
          datasource: Prometheus
        # Ref: https://grafana.com/grafana/dashboards/13665
        speedtest:
          json: |
            {
              "uid": "-fs18ztMz",
              "title": "Speedtest Dashboard",
              "description": "Dashboard for Speedtest Exporter https://github.com/MiguelNdeCarvalho/speedtest-exporter",
              "schemaVersion": 39,
              "version": 6,
              "editable": true,
              "graphTooltip": 0,
              "panels": [
                {
                  "id": 2,
                  "title": "Download Speed",
                  "type": "timeseries",
                  "datasource": "Prometheus",
                  "description": "One bar per hourly test, with touching bars and visible outlines.",
                  "gridPos": {
                    "h": 9,
                    "w": 12,
                    "x": 0,
                    "y": 0
                  },
                  "interval": "1h",
                  "fieldConfig": {
                    "defaults": {
                      "unit": "bps",
                      "min": 0,
                      "color": {
                        "mode": "fixed",
                        "fixedColor": "blue"
                      },
                      "custom": {
                        "drawStyle": "bars",
                        "barAlignment": -1,
                        "barWidthFactor": 1,
                        "lineWidth": 2,
                        "fillOpacity": 35,
                        "gradientMode": "none",
                        "showPoints": "never",
                        "spanNulls": false,
                        "stacking": {
                          "mode": "none",
                          "group": "A"
                        }
                      }
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "displayMode": "table",
                      "placement": "bottom",
                      "calcs": [
                        "min",
                        "mean",
                        "max"
                      ]
                    },
                    "tooltip": {
                      "mode": "single",
                      "sort": "none"
                    }
                  },
                  "targets": [
                    {
                      "expr": "last_over_time(speedtest_download_bits_per_second[1h])",
                      "interval": "1h",
                      "legendFormat": "Download",
                      "refId": "A",
                      "range": true,
                      "instant": false
                    }
                  ]
                },
                {
                  "id": 3,
                  "title": "Upload Speed",
                  "type": "timeseries",
                  "datasource": "Prometheus",
                  "description": "One bar per hourly test, with touching bars and visible outlines.",
                  "gridPos": {
                    "h": 9,
                    "w": 12,
                    "x": 12,
                    "y": 0
                  },
                  "interval": "1h",
                  "fieldConfig": {
                    "defaults": {
                      "unit": "bps",
                      "min": 0,
                      "color": {
                        "mode": "fixed",
                        "fixedColor": "purple"
                      },
                      "custom": {
                        "drawStyle": "bars",
                        "barAlignment": -1,
                        "barWidthFactor": 1,
                        "lineWidth": 2,
                        "fillOpacity": 35,
                        "gradientMode": "none",
                        "showPoints": "never",
                        "spanNulls": false,
                        "stacking": {
                          "mode": "none",
                          "group": "A"
                        }
                      }
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "displayMode": "table",
                      "placement": "bottom",
                      "calcs": [
                        "min",
                        "mean",
                        "max"
                      ]
                    },
                    "tooltip": {
                      "mode": "single",
                      "sort": "none"
                    }
                  },
                  "targets": [
                    {
                      "expr": "last_over_time(speedtest_upload_bits_per_second[1h])",
                      "interval": "1h",
                      "legendFormat": "Upload",
                      "refId": "A",
                      "range": true,
                      "instant": false
                    }
                  ]
                },
                {
                  "id": 4,
                  "title": "Ping",
                  "type": "timeseries",
                  "datasource": "Prometheus",
                  "description": "One bar per hourly test, with touching bars and visible outlines.",
                  "gridPos": {
                    "h": 9,
                    "w": 12,
                    "x": 0,
                    "y": 9
                  },
                  "interval": "1h",
                  "fieldConfig": {
                    "defaults": {
                      "unit": "ms",
                      "min": 0,
                      "color": {
                        "mode": "fixed",
                        "fixedColor": "green"
                      },
                      "custom": {
                        "drawStyle": "bars",
                        "barAlignment": -1,
                        "barWidthFactor": 1,
                        "lineWidth": 2,
                        "fillOpacity": 35,
                        "gradientMode": "none",
                        "showPoints": "never",
                        "spanNulls": false,
                        "stacking": {
                          "mode": "none",
                          "group": "A"
                        }
                      }
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "displayMode": "table",
                      "placement": "bottom",
                      "calcs": [
                        "min",
                        "mean",
                        "max"
                      ]
                    },
                    "tooltip": {
                      "mode": "single",
                      "sort": "none"
                    }
                  },
                  "targets": [
                    {
                      "expr": "last_over_time(speedtest_ping_latency_milliseconds[1h])",
                      "interval": "1h",
                      "legendFormat": "Ping (ms)",
                      "refId": "A",
                      "range": true,
                      "instant": false
                    }
                  ]
                },
                {
                  "id": 5,
                  "title": "Jitter",
                  "type": "timeseries",
                  "datasource": "Prometheus",
                  "description": "One bar per hourly test, with touching bars and visible outlines.",
                  "gridPos": {
                    "h": 9,
                    "w": 12,
                    "x": 12,
                    "y": 9
                  },
                  "interval": "1h",
                  "fieldConfig": {
                    "defaults": {
                      "unit": "ms",
                      "min": 0,
                      "color": {
                        "mode": "fixed",
                        "fixedColor": "orange"
                      },
                      "custom": {
                        "drawStyle": "bars",
                        "barAlignment": -1,
                        "barWidthFactor": 1,
                        "lineWidth": 2,
                        "fillOpacity": 35,
                        "gradientMode": "none",
                        "showPoints": "never",
                        "spanNulls": false,
                        "stacking": {
                          "mode": "none",
                          "group": "A"
                        }
                      }
                    },
                    "overrides": []
                  },
                  "options": {
                    "legend": {
                      "displayMode": "table",
                      "placement": "bottom",
                      "calcs": [
                        "min",
                        "mean",
                        "max"
                      ]
                    },
                    "tooltip": {
                      "mode": "single",
                      "sort": "none"
                    }
                  },
                  "targets": [
                    {
                      "expr": "last_over_time(speedtest_jitter_latency_milliseconds[1h])",
                      "interval": "1h",
                      "legendFormat": "Jitter (ms)",
                      "refId": "A",
                      "range": true,
                      "instant": false
                    }
                  ]
                }
              ],
              "time": {
                "from": "now-2d",
                "to": "now"
              },
              "timezone": "browser",
              "refresh": "5m",
              "tags": [
                "networking"
              ],
              "templating": {
                "list": []
              }
            }
        cert-manager:
          url: https://raw.githubusercontent.com/monitoring-mixins/website/master/assets/cert-manager/dashboards/cert-manager.json
          datasource: Prometheus

    serviceMonitor:
      enabled: true
