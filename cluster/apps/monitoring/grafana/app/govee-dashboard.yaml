apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-govee
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  govee.json: |
    {
      "uid": "govee-h5075",
      "title": "Govee H5075",
      "schemaVersion": 39,
      "version": 5,
      "refresh": "30s",
      "time": {
        "from": "now-24h",
        "to": "now"
      },
      "tags": [
        "sensors",
        "govee"
      ],
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "refresh": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "title": "Temperature (\u00b0F)",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "govee_temperature_celsius * 9 / 5 + 32",
              "legendFormat": "{{sensor}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "fahrenheit"
            },
            "overrides": []
          }
        },
        {
          "id": 2,
          "title": "Relative humidity",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 0,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "govee_humidity_percent",
              "legendFormat": "{{sensor}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          }
        },
        {
          "id": 3,
          "title": "Battery",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "govee_battery_percent",
              "legendFormat": "{{sensor}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "percent"
            },
            "overrides": []
          }
        },
        {
          "id": 4,
          "title": "Reading age",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 8,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "time() - govee_last_seen_timestamp_seconds",
              "legendFormat": "{{sensor}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        },
        {
          "id": 5,
          "title": "Bluetooth signal",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "govee_rssi_dbm",
              "legendFormat": "{{sensor}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "dBm"
            },
            "overrides": []
          }
        },
        {
          "id": 6,
          "title": "Collector update age",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 16,
            "w": 12,
            "h": 8
          },
          "datasource": {
            "type": "prometheus",
            "uid": "$datasource"
          },
          "targets": [
            {
              "expr": "time() - govee_exporter_last_write_timestamp_seconds",
              "legendFormat": "{{sensor}}",
              "refId": "A"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          }
        }
      ]
    }
