---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: blocky
  namespace: networking
spec:
  interval: 5m
  chart:
    spec:
      # renovate: registryUrl=https://k8s-at-home.com/charts/
      chart: blocky
      version: 10.5.2
      sourceRef:
        kind: HelmRepository
        name: k8s-at-home
        namespace: flux-system
      interval: 5m
  maxHistory: 3
  values:
    service:
      main:
        ports:
          http:
            port: 4000
      dns-tcp:
        enabled: false
      dns-udp:
        enabled: true
        type: LoadBalancer
        loadBalancerIP: "${BLOCKY}"
        externalTrafficPolicy: Local
        ports:
          dns-udp:
            enabled: true
            port: 53
            protocol: UDP
            targetPort: 53
    controller:
      replicas: 2
    podAnnotations:
      checksum/config: "blocky-metrics-ha-2026-10-03"
    metrics:
      enabled: true
      serviceMonitor:
        interval: 30s
        scrapeTimeout: 10s
      prometheusRule:
        enabled: true
    config: |
      prometheus:
        enable: true
      upstream:
        default:
          - 1.1.1.1
          - 1.0.0.1
      conditional:
        mapping:
          ${CLUSTER_DOMAIN}: k8s-gateway.networking.svc.cluster.local
      blocking:
        refreshPeriod: 4h
        blackLists:
          ads:
          - https://raw.githubusercontent.com/StevenBlack/hosts/master/hosts
          - https://raw.githubusercontent.com/hagezi/dns-blocklists/main/wildcard/multi-onlydomains.txt
        clientGroupsBlock:
          default:
            - ads
      port: 53
      httpPort: 4000
