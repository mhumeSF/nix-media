---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: speedtest-exporter
  namespace: flux-system
spec:
  dependsOn:
  - name: kube-prometheus-stack
  path: ./cluster/apps/networking/speedtest-exporter/app
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
  - apiVersion: apps/v1
    kind: Deployment
    name: speedtest-exporter
    namespace: networking
  interval: 30m
  retryInterval: 1m
  timeout: 5m
