---
# Backblaze B2 backup source: only the curated photo archive.
# Path is on the `gato-bucket` virtiofs share (VM: /gato-bucket/photos/archive
# -> host media.local: /tank0/gato-bucket/photos/archive). nodeAffinity pins the
# claim (and therefore the rclone pod) to the node that has this share. This is
# critical: the backup job must never interpret a missing mount as a request to
# delete the remote archive. `rclone copy` uploads new and changed objects but
# deliberately leaves remote objects that are absent from the source.
apiVersion: v1
kind: PersistentVolume
metadata:
  name: photos-archive-pv
spec:
  capacity:
    storage: 100Gi
  accessModes:
  - ReadWriteMany
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /gato-bucket/photos/archive
    type: Directory
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k3s
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: photos-archive-pvc
  namespace: backup
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: ""
  volumeName: photos-archive-pv
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: Secret
metadata:
  name: rclone-config
  namespace: backup
stringData:
  rclone.conf: |
    [b2]
    type = b2
    account = ${B2_APPLICATION_KEY_ID}
    key = ${B2_APPLICATION_KEY}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: rclone-sync
  namespace: backup
spec:
  schedule: "0 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: OnFailure
          containers:
          - name: rclone
            image: rclone/rclone:1.74.2
            args:
            - copy
            - /data
            - b2:${B2_BUCKET}
            - --verbose
            - --checksum
            volumeMounts:
            - name: data
              mountPath: /data
              readOnly: true
            - name: rclone-config
              mountPath: /config/rclone
              readOnly: true
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: photos-archive-pvc
          - name: rclone-config
            secret:
              secretName: rclone-config
